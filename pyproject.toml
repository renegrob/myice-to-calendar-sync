[project]
name = "myice-to-calendar-sync"
version = "0.1.0"
description = "Syncs myice.hockey games and trainings to Google Calendar using AWS Lambda"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-httplib2>=0.2.0",
]

[dependency-groups]
dev = [
    "boto3>=1.34.0",
]
